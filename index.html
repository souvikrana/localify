<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta
      name="description"
      content="Localify — a local-first music player. Your music lives on your device and plays completely offline."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Localify</title>
    <script>
      // Apply persisted theme before first paint to avoid flashes.
      try {
        var s = JSON.parse(localStorage.getItem('localify:settings') || '{}');
        var theme = s['appearance.theme'] || 'system';
        var dark =
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        var accent = s['appearance.accent'];
        if (accent) document.documentElement.style.setProperty('--accent', accent);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Localify requires JavaScript because it runs entirely in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
